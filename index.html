<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Новая я</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* Layout: одна колонка шириной с телефон, нижняя навигация из 5 вкладок, листы снизу для редактирования */
:root{
  --bg:#FAF4F0; --surface:#FFFCFA; --surface-2:#EFE3DB; --ink:#3B2A22; --muted:#8B746A; --line:#E7D9D0;
  --heart:#D9557A; --heart-soft:#F8DCE4; --done:#66784A; --done-soft:#E3E8D2; --gold:#B5873C; --gold-soft:#F3E4C6;
  --boss:#3B2A22; --boss-ink:#F8EEE7; --frost:#9DBBCB; --scrim:rgba(40,26,20,.45);
  --skin:#F8DFCF; --skin-d:#EDC6B1; --skin-dd:#C99A86; --hair:#9C7550; --hair-d:#6E5036; --hair-l:#C29C70; --brow:#5A4130; --iris:#5A90CC; --lip:#E08A8C; --lip-d:#C9707A; --top:#D9A49C; --blazer:#2A211F; --shirt:#F3ECE4; --lens:#231B19;
  --sp-body:#D9744F; --sp-beauty:#DE7A9B; --sp-health:#3F9C92; --sp-mind:#5C86C9; --sp-italy:#5E9E5A; --sp-money:#C1962F; --sp-channel:#C0619E; --sp-art:#7A6CCF; --sp-soul:#6FA0B5; --sp-love:#D2565E; --sp-life:#E39A42; --sp-x:#B5873C;
  --f-display:'Unbounded','Manrope',system-ui,sans-serif;
  --f-body:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:20px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#201815; --surface:#261D1A; --surface-2:#33281F; --ink:#F4E9E2; --muted:#A8938A; --line:#3A2E29;
  --heart:#F07C9A; --heart-soft:#4A2532; --done:#A6B97C; --done-soft:#2D3322; --gold:#D9AE62; --gold-soft:#3D2F1A;
  --boss:#F1E2D4; --boss-ink:#2A1F1A; --frost:#5C7F92; --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#201815; --surface:#261D1A; --surface-2:#33281F; --ink:#F4E9E2; --muted:#A8938A; --line:#3A2E29;
  --heart:#F07C9A; --heart-soft:#4A2532; --done:#A6B97C; --done-soft:#2D3322; --gold:#D9AE62; --gold-soft:#3D2F1A;
  --boss:#F1E2D4; --boss-ink:#2A1F1A; --frost:#5C7F92; --scrim:rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--heart);outline-offset:2px}
.app{max-width:480px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px calc(96px + env(safe-area-inset-bottom,0px))}
.view{display:flex;flex-direction:column;gap:14px}
h1,h2,h3,p{margin:0}
h2{font-family:var(--f-display);font-weight:500;font-size:19px;letter-spacing:-.01em;text-wrap:balance}
h3{font-size:15px;font-weight:700}
.eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.card{background:var(--surface);border-radius:var(--r);padding:16px;border:1px solid var(--line)}
.stack{display:flex;flex-direction:column;gap:10px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none;background:var(--c)}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--c,var(--heart));border-radius:inherit;transition:width .5s ease}
.bar.thin{height:5px}

/* hero */
.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.top .day{font-weight:700}
.hero{display:grid;grid-template-columns:84px minmax(0,1fr);gap:16px;align-items:center}
.hero .av{width:84px;height:84px}
.big{font-family:var(--f-display);font-size:36px;font-weight:500;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.big small{font-size:20px;margin-left:4px}
.lvl{font-weight:700;font-size:13px;color:var(--heart)}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{display:flex;align-items:center;gap:6px;padding:7px 11px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-size:13px;font-weight:600}
.stat svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.stat.fire{color:var(--sp-body);cursor:pointer}
.stat.frost{color:var(--frost)}

/* week */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.wd{font-size:11px;color:var(--muted);font-weight:600;text-transform:lowercase}
.wc{width:32px;height:32px;margin:5px auto 0;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--surface-2);color:var(--muted)}
.wc.ok{background:var(--done);color:var(--surface)}
.wc.fr{background:var(--frost);color:var(--surface)}
.wc.miss{background:transparent;border:1.5px dashed var(--line)}
.wc.none{opacity:.35}
.wc.today{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--heart)}

.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-size:12px;padding:5px 10px;border-radius:99px;background:var(--surface-2);color:var(--muted);font-weight:700}
.pill.ok{background:var(--done-soft);color:var(--done)}
.banner{background:var(--heart-soft);color:var(--ink);border-radius:16px;padding:12px 14px;font-size:14px}
.banner b{color:var(--heart)}

/* habits */
.list{display:flex;flex-direction:column}
.hrow{display:flex;align-items:center;gap:12px;width:100%;padding:12px 0;border-top:1px solid var(--line)}
.list>.hrow:first-child{border-top:0;padding-top:2px}
.list>.hrow:last-child{padding-bottom:2px}
.chk{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;transition:background .2s,border-color .2s,transform .2s}
.chk svg{width:15px;height:15px;stroke:var(--surface);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.hrow.done .chk{background:var(--done);border-color:var(--done)}
.hrow.done .chk svg{opacity:1}
.hrow:active .chk{transform:scale(.9)}
.hn{flex:1;min-width:0}
.hn b{font-weight:600;display:block}
.hrow.done .hn b{color:var(--muted)}
.hn small{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-top:2px}
.hp{font-size:13px;color:var(--heart);font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums}
.daynav{display:grid;grid-template-columns:40px minmax(0,1fr) 40px;align-items:center;gap:8px;text-align:center}
.dn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface-2);color:var(--ink)}
.dn:disabled{opacity:.3}
.dn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.dt{display:flex;flex-direction:column;gap:1px}
.dt b{font-weight:700;font-size:16px}
.soon{display:flex;flex-direction:column;gap:6px;font-size:13px}
.soon div{display:flex;gap:8px}
.soon b{white-space:nowrap;min-width:84px}
.linkbtn{font-weight:700;color:var(--heart);font-size:14px;padding:6px 0}

/* chips / segmented */
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px))}
.chips::-webkit-scrollbar{display:none}
.chip{display:flex;align-items:center;gap:6px;padding:8px 13px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-size:13px;font-weight:700;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:14px;padding:3px}
.seg button{padding:9px;border-radius:11px;font-weight:700;font-size:14px;text-align:center;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}

/* quests */
.qgroup{display:flex;flex-direction:column;gap:8px}
.qhead{display:flex;align-items:center;gap:8px;margin-top:6px}
.qhead h3{flex:1}
.q{display:flex;gap:12px;align-items:center;padding:13px 12px 13px 14px;background:var(--surface);border:1px solid var(--line);border-radius:16px}
.qn{flex:1;min-width:0}
.qn b{font-weight:600;display:block}
.qm{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;margin-top:3px}
.qm .h{color:var(--heart);font-weight:800}
.tag{font-size:10px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--gold)}
.qbtn{flex:none;min-width:48px;height:38px;border-radius:12px;background:var(--heart-soft);color:var(--heart);font-weight:800;padding:0 12px;font-size:14px;font-variant-numeric:tabular-nums;text-align:center}
.qbtn:disabled{background:var(--done-soft);color:var(--done)}
.q.boss{background:var(--boss);color:var(--boss-ink);border-color:transparent}
.q.boss .qm{color:color-mix(in srgb,var(--boss-ink) 62%,transparent)}
.q.boss .qm .h{color:var(--gold)}
.q.boss .qbtn{background:var(--gold);color:var(--boss)}
.q.legend{border:1.5px solid var(--gold);background:linear-gradient(135deg,var(--surface) 30%,var(--gold-soft))}
.q.legend .qbtn{background:var(--gold);color:var(--surface)}
.q.isdone{opacity:.62}
.q.isdone .qn b{text-decoration:line-through;text-decoration-thickness:1px}

/* me */
.portrait{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding-top:4px}
.portrait .av{width:min(240px,68vw);height:min(240px,68vw)}
.portrait h2{font-size:22px}
.sph{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center}
.sph .nm{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px}
.sph .bar{grid-column:1/-1}
.shelf{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.item{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 4px;border-radius:14px;background:var(--surface-2);font-size:11px;font-weight:700;text-align:center;line-height:1.2}
.item svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.item.has{background:var(--gold-soft);color:var(--ink)}
.item.has svg{stroke:var(--gold)}
.item.lock{color:var(--muted);opacity:.7}

/* rewards */
.rw{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:18px}
.rw .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--surface-2);color:var(--muted)}
.rw .ic svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.rw.open{border-color:var(--gold)}
.rw.open .ic{background:var(--gold-soft);color:var(--gold)}
.rw.got .ic{background:var(--done-soft);color:var(--done)}
.rw b{display:block;font-weight:700}
.rw .act{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:13px 16px;border-radius:14px;font-weight:800;background:var(--ink);color:var(--bg);font-size:15px}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:11px}
.btn.gold{background:var(--gold);color:var(--surface)}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.soft{background:var(--heart-soft);color:var(--heart)}
.btn.danger{background:transparent;color:var(--heart);border:1.5px solid var(--heart-soft)}
.btn.wide{width:100%}
.state{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.state.got{color:var(--done)}
.state.open{color:var(--gold)}

/* progress */
.heat{display:grid;grid-template-columns:repeat(26,minmax(0,1fr));grid-template-rows:repeat(7,auto);grid-auto-flow:column;gap:3px}
.heat .c{display:block;width:100%;aspect-ratio:1;border-radius:3px;background:var(--surface-2)}
.heat .c.l1{background:color-mix(in srgb,var(--heart) 28%,var(--surface-2))}
.heat .c.l2{background:color-mix(in srgb,var(--heart) 52%,var(--surface-2))}
.heat .c.l3{background:color-mix(in srgb,var(--heart) 76%,var(--surface-2))}
.heat .c.l4{background:var(--heart)}
.heat .c.t{outline:1.5px solid var(--ink);outline-offset:1px}
.heat .c.f{opacity:.35}
.legend{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--muted)}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.mgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.metric{display:flex;flex-direction:column;gap:6px;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:18px;text-align:left;min-width:0}
.metric .v{font-family:var(--f-display);font-size:24px;font-weight:500;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.metric .v small{font-size:13px;margin-left:3px;color:var(--muted);font-family:var(--f-body);font-weight:700}
.metric svg{width:100%;height:40px;overflow:visible}
.cd{display:flex;align-items:center;gap:14px}
.cd .n{font-family:var(--f-display);font-size:30px;font-weight:500;line-height:1;font-variant-numeric:tabular-nums}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(6px,env(safe-area-inset-left,0px));padding-right:max(6px,env(safe-area-inset-right,0px))}
.nav-in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;font-size:10.5px;font-weight:700;color:var(--muted);text-align:center}
.nav button[aria-current="page"]{color:var(--heart)}
.nav svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* sheets & modals */
.overlay{position:fixed;inset:0;background:var(--scrim);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s ease}
.overlay.center{align-items:center;padding:24px}
.sheet{background:var(--bg);width:100%;max-width:480px;max-height:90vh;max-height:90dvh;overflow:auto;border-radius:24px 24px 0 0;padding-top:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));animation:up .28s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;gap:14px}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 4px}
.modal{background:var(--bg);border-radius:26px;padding:24px 20px 20px;max-width:360px;width:100%;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;animation:pop .35s cubic-bezier(.2,1.3,.4,1)}
.modal .av{width:150px;height:150px}
.modal .big{font-size:28px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:12px;font-weight:700;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;font:inherit;font-size:16px;padding:12px 13px;border-radius:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);min-width:0}
.field textarea{min-height:120px;font-size:13px;font-family:ui-monospace,Menlo,monospace}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.check{display:flex;align-items:center;gap:10px;font-weight:600}
.check input{width:22px;height:22px;accent-color:var(--heart)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns .btn{flex:1}
.erow{display:flex;align-items:center;gap:10px;width:100%;padding:11px 0;border-top:1px solid var(--line);text-align:left}
.erow:first-child{border-top:0}
.erow span.t{flex:1;min-width:0}
.erow small{display:block;color:var(--muted);font-size:12px}
.hist{display:flex;flex-direction:column;gap:6px;font-size:13px}
.hist div{display:flex;justify-content:space-between;gap:10px}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:14px;font-weight:700;font-size:14px;max-width:calc(100% - 32px);text-align:center;animation:toast 2.6s ease forwards;pointer-events:none}
.fx{position:fixed;z-index:70;pointer-events:none;font-weight:800;color:var(--heart);font-size:16px;animation:fly .95s ease-out forwards;white-space:nowrap}

@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{transform:scale(.85);opacity:0}}
@keyframes toast{0%{opacity:0;transform:translate(-50%,10px)}10%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
@keyframes fly{0%{opacity:0;transform:translate(-50%,0) scale(.8)}20%{opacity:1;transform:translate(-50%,-14px) scale(1.1)}100%{opacity:0;transform:translate(-50%,-60px) scale(1)}}
@keyframes twinkle{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}
.spark{transform-box:fill-box;transform-origin:center;animation:twinkle 2.4s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

</head>

const DAY = 864e5;
const MON = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];

const WD = ['вс','пн','вт','ср','чт','пт','сб'];
const WDF = ['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
const pad = n => String(n).padStart(2,'0');
const isoOf = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseISO = s => { const a = String(s).split('-').map(Number); return new Date(a[0], a[1]-1, a[2]); };
const midnight = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const dayNum = d => Math.round((midnight(d) - parseISO(S.start)) / DAY);
const T = () => dayNum(new Date());
const dateOf = n => { const d = parseISO(S.start); d.setDate(d.getDate()+n); return d; };
const dShort = n => { const d = dateOf(n); return d.getDate()+' '+MON_S[d.getMonth()]; };
const plural = (n,a,b,c) => { n = Math.abs(n)%100; const m = n%10; if (n>10&&n<20) return c; if (m>1&&m<5) return b; if (m===1) return a; return c; };

const Store = {
  cloud:null, timer:null, busy:false, again:false, prevN:0, KEY:'novaya-ya-v1',
  init(){ if (inTG && ver('6.9') && tg.CloudStorage) this.cloud = tg.CloudStorage; },
  call(fn, ...a){ return new Promise(res => { try { fn.call(this.cloud, ...a, (err,v) => res(err ? null : v)); } catch(e){ res(null); } }); },
  async load(){
    let local = null, cloud = null;
    try { local = JSON.parse(localStorage.getItem(this.KEY)); } catch(e){}
    if (this.cloud){
      const n = +(await this.call(this.cloud.getItem, 'n')) || 0;
      this.prevN = n;
      if (n){
        const keys = Array.from({length:n}, (_,i) => 's'+i);
        let str = '';
        for (let i=0; i<keys.length; i+=10){
          const part = keys.slice(i,i+10);
          const v = await this.call(this.cloud.getItems, part);
          if (!v){ str = null; break; }
          for (const k of part) str += v[k] || '';
        }
        try { cloud = str ? JSON.parse(str) : null; } catch(e){ cloud = null; }
      }
    }
    if (local && cloud) return (cloud.savedAt||0) >= (local.savedAt||0) ? cloud : local;
    return cloud || local;
  },
  save(){ clearTimeout(this.timer); this.timer = setTimeout(() => this.flush(), 600); },
  async flush(){
    clearTimeout(this.timer);
    if (this.busy){ this.again = true; return; }
    this.busy = true;
    S.savedAt = Date.now();
    const str = JSON.stringify(S);
    try { localStorage.setItem(this.KEY, str); } catch(e){}
    if (this.cloud){
      const size = 3000, n = Math.ceil(str.length/size);
      for (let i=0; i<n; i++) await this.call(this.cloud.setItem, 's'+i, str.slice(i*size, (i+1)*size));
      await this.call(this.cloud.setItem, 'n', String(n));
      if (this.prevN > n) await this.call(this.cloud.removeItems, Array.from({length:this.prevN-n}, (_,i) => 's'+(n+i)));
      this.prevN = n;
    }
    this.busy = false;
    if (this.again){ this.again = false; this.flush(); }
  }
};
const save = () => Store.save();

function normalize(st){
  const f = fresh();
  for (const k in f) if (st[k] === undefined) st[k] = f[k];
  st.streak = Object.assign({c:0,f:0,m:0}, st.streak);
  st.base = Object.assign({t:0,s:{}}, st.base);
  if ((st.v||1) < 2){
    st.rewards = clone(DEF_R.filter(r => r.lv)).concat(st.rewards.filter(r => !r.lv));
    st.habits.forEach(h => { delete h.core; });
    st.v = 2;
  }
  if (st.v < 3){
    const mv = {i_course:'mind', i_50:'mind', i_a2:'mind', i_b1:'mind', j_page:'art', j_comic:'art'};
    st.quests.forEach(q => { if (mv[q.id]) q.s = mv[q.id]; });
    st.habits.forEach(h => { if (h.id === 'ita') h.s = 'mind'; });
    ['a_puzzle','a_canvas'].forEach(id => { if (!st.quests.some(q => q.id === id)) st.quests.push(clone(DEF_Q.find(q => q.id === id))); });
    st.events.forEach(e => { const id = String(e[1]).split(':')[1]; if (e[1] === 'h:ita') e[3] = 'mind'; else if (/^qx?:/.test(e[1]) && mv[id]) e[3] = mv[id]; });
    st.v = 3;
  }
  return st;
}

/* ---------- сердечки ---------- */
function addEv(d, key, h, s){ S.events.push([d, key, h, s]); S.days[d] = (S.days[d]||0) + h; }
function rmLast(fn){
  for (let i=S.events.length-1; i>=0; i--){
    if (fn(S.events[i])){ const e = S.events.splice(i,1)[0]; S.days[e[0]] = (S.days[e[0]]||0) - e[2]; return e; }
  }
  return null;
}
const hasEv = (d, key) => S.events.some(e => e[0]===d && e[1]===key);
function totals(){
  let t = S.base.t; const sp = Object.assign({}, S.base.s);
  for (const e of S.events){ t += e[2]; sp[e[3]] = (sp[e[3]]||0) + e[2]; }
  return {t:Math.max(0,t), sp};
}
function lvl(t){
  const n = Math.floor(Math.max(0,t)/COST) + 1;
  return {n, name: LEVELS[Math.min(n,LEVELS.length)-1] + (n > LEVELS.length ? ' +' + (n-LEVELS.length) : ''), cur: t - (n-1)*COST};
}

/* ---------- привычки, серия ---------- */
const week = d => Math.floor(d/7);
const hActive = (h, d) => week(d) >= (h.from||0) && (h.to == null || week(d) < h.to);
function minDone(d){
  const act = S.habits.filter(h => hActive(h,d));
  if (!act.length) return false;
  return act.filter(h => hasEv(d, 'h:'+h.id)).length >= minNeed(d);
}
const toasts = [];
function recalc(){
  const t = T(), old = S.lastChecked;
  S.events = S.events.filter(e => !/^b:(s7|s30|cb):/.test(e[1]));
  S.days = {}; for (const e of S.events) S.days[e[0]] = (S.days[e[0]]||0) + e[2];
  let c = 0, f = 0, m = 0; const fr = [];
  const msg = (d, text) => { if (d > old) toasts.push(text); };
  for (let d = 0; d < t; d++){
    if (minDone(d)){
      if (m >= 3) addEv(d, 'b:cb:'+d, 100, 'x');
      c++; m = 0;
      if (c % 7 === 0){ f = Math.min(2, f+1); addEv(d, 'b:s7:'+d, 50, 'x'); msg(d, 'Серия ' + c + ' ' + plural(c,'день','дня','дней') + ': +50 💗 и заморозка'); }
      if (c % 30 === 0){ addEv(d, 'b:s30:'+d, 300, 'x'); msg(d, '30 дней подряд: +300 💗'); }
    } else if (c > 0 && f > 0){ f--; fr.push(d); msg(d, 'Заморозка спасла серию за ' + dShort(d)); }
    else { if (c > 0) msg(d, 'Серия прервалась. Начинаем заново, без минусов'); c = 0; m++; }
  }
  if (m >= 3 && minDone(t)) addEv(t, 'b:cb:'+t, 100, 'x');
  S.streak = {c, f, m}; S.frozen = fr; S.comeback = m >= 3; S.lastChecked = t - 1;
}
function minNeed(d){ return Math.min(4, S.habits.filter(h => hActive(h,d)).length); }
function streakNow(){ return S.streak.c + (minDone(T()) ? 1 : 0); }

/* ---------- награды и уровень ---------- */
const quest = id => S.quests.find(q => q.id === id);
function rOpen(r, L){ if (r.lv) return L >= r.lv; if (r.q){ const q = quest(r.q); return !!(q && (q.done || q.cnt > 0)); } return false; }
function checkLevel(){
  const L = lvl(totals().t).n;
  if (L > S.seen){
    S.seen = L;
    const unlocked = S.rewards.filter(r => r.lv === L && !r.got);
    haptic('success');
    showModal(`<div class="av">${avatar({id:'m', level:L})}</div>
      <p class="eyebrow">Новый уровень</p>
      <p class="big">${L}</p><h2>${esc(lvl(totals().t).name)}</h2>
      ${unlocked.length ? `<p class="muted">Открыта награда: <b style="color:var(--ink)">${unlocked.map(r=>esc(r.n)).join(', ')}</b>. Ты её заработала.</p>` : '<p class="muted">Ты становишься той самой версией себя.</p>'}
      <button class="btn wide" data-a="close">Дальше</button>`);
  }
}
function itemsOwned(){ return new Set(S.rewards.filter(r => r.got).map(r => r.item)); }

function avatar(o){
  const L = o.level || 1, it = o.items || itemsOwned(), sad = !!o.sad, id = 'av' + (o.id || '0');
  let g = `<defs><clipPath id="${id}c"><circle cx="100" cy="100" r="96"/></clipPath>
    <radialGradient id="${id}g"><stop offset="0" stop-color="var(--heart)" stop-opacity=".32"/><stop offset="1" stop-color="var(--heart)" stop-opacity="0"/></radialGradient></defs>`;
  g += `<circle cx="100" cy="100" r="96" fill="var(--surface-2)"/><g clip-path="url(#${id}c)">`;
  if (L >= 4 && !sad) g += `<circle cx="100" cy="100" r="96" fill="url(#${id}g)"/>`;
  g += `<image href="${it.has('outfit') ? AV_IMG_OUTFIT : AV_IMG}" x="0" y="3" width="200" height="200" preserveAspectRatio="xMidYMid meet"${sad ? ' style="filter:saturate(.45) brightness(.97)"' : ''}/>`;
  if (it.has('outfit')) g += `<path d="M86 162q14 14 28 0" fill="none" stroke="var(--gold)" stroke-width="1.4"/><circle cx="100" cy="169.5" r="2.2" fill="var(--gold)"/>`;
  if (it.has('glasses')){
    g += `<g transform="rotate(-4 100 33)"><rect x="71" y="26" width="26" height="14" rx="6.5" fill="var(--lens)"/><rect x="103" y="26" width="26" height="14" rx="6.5" fill="var(--lens)"/>
      <path d="M97 31q3-2.6 6 0" fill="none" stroke="var(--lens)" stroke-width="2.4"/><path d="M76 30h6M108 30h6" stroke="#fff" stroke-width="1.5" stroke-linecap="round" opacity=".45"/></g>`;
  }
  g += `</g>`;
  if (L >= 5 && !sad) g += `<circle cx="100" cy="100" r="96" fill="none" stroke="var(--gold)" stroke-width="2.2" opacity=".85"/>`;
  if (!sad){
    const sp = [[24,44,7],[176,40,6],[180,128,5],[20,138,5],[154,14,4]];
    for (let i=0; i<Math.min(L-1, sp.length); i++) g += star(sp[i][0], sp[i][1], sp[i][2], i);
  }
  return `<svg viewBox="0 0 200 200" role="img" aria-label="Аватар, уровень ${L}">${g}</svg>`;
}

/* ---------- рендер ---------- */
function render(){
  const day = T();
  if (UI.lastDay !== day){ UI.lastDay = day; UI.sel = day; recalc(); save(); }
  $('#nav').innerHTML = NAV.map(n => `<button data-a="tab" data-t="${n[0]}" ${UI.tab===n[0] ? 'aria-current="page"' : ''}><svg viewBox="0 0 24 24" aria-hidden="true">${n[2]}</svg>${n[1]}</button>`).join('');
  const v = {today:vToday, quests:vQuests, me:vMe, rewards:vRewards, progress:vProgress}[UI.tab]();
  $('#app').innerHTML = `<div class="view">${v}</div>`;
  while (toasts.length) toast(toasts.shift());
}

function sad(){ const t = T(); return S.comeback && !hasEv(t, 'b:cb:'+t); }

function vToday(){
  const t = T(), now = new Date(), tot = totals().t, L = lvl(tot);
  const d = Math.max(0, Math.min(UI.sel == null ? t : UI.sel, t)), past = d < t, dd = dateOf(d);
  const doneT = S.habits.filter(h => hActive(h,t) && hasEv(t,'h:'+h.id)).length;
  const act = S.habits.filter(h => hActive(h,d));
  const done = act.filter(h => hasEv(d,'h:'+h.id)).length;
  const today = S.days[t] || 0;
  const st = streakNow();
  const ok = minDone(t), need = minNeed(t);
  // привычки
  const rows = act.map(h => {
    const isDone = hasEv(d,'h:'+h.id);
    let sub = `<span class="dot" style="--c:var(--sp-${h.s})"></span>${esc(SPH[h.s]||'')}`;
    if (h.pw){
      let c = 0; for (let x = week(d)*7; x < week(d)*7 + 7 && x <= t; x++) if (hasEv(x,'h:'+h.id)) c++;
      sub += ` · ${c} из ${h.pw} на этой неделе`;
    }
    return `<button class="hrow ${isDone?'done':''}" data-a="hab" data-id="${esc(h.id)}" aria-pressed="${isDone}">
      <span class="chk">${svgI('check')}</span><span class="hn"><b>${esc(h.n)}</b><small>${sub}</small></span><span class="hp">+${h.h} 💗</span></button>`;
  }).join('');
  // скоро
  const groups = {};
  S.habits.filter(h => (h.from||0) > week(t)).forEach(h => { (groups[h.from] = groups[h.from] || []).push(h); });
  const soonKeys = Object.keys(groups).map(Number).sort((a,b) => a-b).slice(0,3);
  const soon = soonKeys.map(k => `<div><b>с ${dShort(k*7)}</b><span class="muted">${groups[k].map(h=>esc(h.n)).join(', ')}</span></div>`).join('');
  // IELTS
  let ielts = '';
  if (S.ielts){ const n = dayNum(parseISO(S.ielts)) - t; if (n >= 0) ielts = `<span class="stat">IELTS через ${n} ${plural(n,'день','дня','дней')}</span>`; }

  return `
  <div class="top"><span class="day">День ${Math.min(t+1,SEASON)} из ${SEASON}</span><span class="muted small">${WDF[now.getDay()]}, ${now.getDate()} ${MON[now.getMonth()]}</span></div>
  <div class="hero">
    <button class="av" data-a="tab" data-t="me" aria-label="Открыть героиню">${avatar({id:'h', level:L.n, sad:sad()})}</button>
    <div class="stack" style="gap:8px">
      <span class="lvl">Уровень ${L.n} · ${esc(L.name)}</span>
      <span class="big">${fmt(tot)}<small>💗</small></span>
      <div class="bar"><i style="width:${(L.cur/COST*100).toFixed(1)}%"></i></div>
      <span class="small muted num">${fmt(L.cur)} / ${fmt(COST)} до уровня ${L.n+1}</span>
    </div>
  </div>
  <div class="stats">
    <button class="stat fire" data-a="streak" aria-label="Как работает серия">${svgI('fire')}серия ${st} ${plural(st,'день','дня','дней')}${ok ? ' ✓' : ` · ${Math.min(doneT,need)}/${need}`}</button>
    <span class="stat frost" title="Заморозки">${svgI('frost')}${S.streak.f} из 2</span>
    <span class="stat">+${fmt(today)} 💗 сегодня</span>
    ${ielts}
  </div>
  ${sad() ? `<div class="banner"><b>Возвращение.</b> Выполни сегодня ${need} ${plural(need,'привычку','привычки','привычек')} и получи +100 💗. Без упрёков, просто продолжаем.</div>` : ''}
  <section class="card stack">
    <div class="daynav">
      <button class="dn" data-a="day" data-v="-1" ${d<=0?'disabled':''} aria-label="Предыдущий день"><svg viewBox="0 0 24 24"><path d="m14.5 6-6 6 6 6"/></svg></button>

function qRow(q){
  const isDone = q.rep ? (q.max && q.cnt >= q.max) : q.done;
  const cls = 'q' + (q.tier ? ' '+q.tier : '') + (isDone ? ' isdone' : '');
  const tag = q.tier === 'boss' ? '<span class="tag">Босс</span>' : q.tier === 'legend' ? '<span class="tag">Легенда</span>' : '';
  let meta = `${tag}<span class="h">+${fmt(q.h)} 💗</span>`;
  if (q.rep) meta += `<span>${q.max ? `${q.cnt} из ${q.max}` : (q.cnt ? `выполнено ${q.cnt} ${plural(q.cnt,'раз','раза','раз')}` : 'повторяемый')}</span>`;
  else if (q.done && q.at != null) meta += `<span>${dShort(q.at)}</span>`;
  const btn = q.rep
    ? `<button class="qbtn" data-a="q-do" data-id="${esc(q.id)}" ${isDone?'disabled':''} aria-label="Выполнить ещё раз">${isDone ? '✓' : '+1'}</button>`
    : `<button class="qbtn" data-a="q-do" data-id="${esc(q.id)}" ${isDone?'disabled':''}>${isDone ? '✓' : 'Готово'}</button>`;
  return `<div class="${cls}"><button class="qn" data-a="q-open" data-id="${esc(q.id)}"><b>${esc(q.n)}</b><span class="qm">${meta}</span></button>${btn}</div>`;
}
function vQuests(){
  const qs = S.quests;
  const isDone = q => q.rep ? (q.max && q.cnt >= q.max) : q.done;
  const doneN = qs.filter(q => q.rep ? q.cnt > 0 : q.done).length;
  const chips = [['all','Все'],['boss','Боссы']].concat(Object.keys(SPH).map(k => [k, SPH[k]]))
    .map(c => `<button class="chip" data-a="qf" data-v="${c[0]}" aria-pressed="${UI.qf===c[0]}">${SPH[c[0]] ? `<span class="dot" style="--c:var(--sp-${c[0]})"></span>` : ''}${c[1]}</button>`).join('');
  let list = qs.filter(q => UI.qv === 'open' ? !isDone(q) : (q.rep ? q.cnt > 0 : q.done));
  if (UI.qf === 'boss') list = list.filter(q => q.tier);
  else if (UI.qf !== 'all') list = list.filter(q => q.s === UI.qf);
  let body = '';
  if (UI.qf === 'all'){
    for (const k of Object.keys(SPH)){
      const items = list.filter(q => q.s === k);
      if (!items.length) continue;
      const all = qs.filter(q => q.s === k);
      body += `<div class="qgroup"><div class="qhead"><span class="dot" style="--c:var(--sp-${k})"></span><h3>${SPH[k]}</h3><span class="small muted num">${all.filter(q=>q.rep?q.cnt>0:q.done).length}/${all.length}</span></div>${items.map(qRow).join('')}</div>`;
    }
  } else body = `<div class="qgroup">${list.map(qRow).join('')}</div>`;
  if (!list.length) body = `<p class="muted" style="text-align:center;padding:24px 0">${UI.qv==='open' ? 'Здесь всё выполнено. Сильно.' : 'Пока ничего не выполнено. Начни с простого квеста.'}</p>`;
  return `
  <div class="between"><h2>Квесты</h2><span class="small muted num">выполнено ${doneN} из ${qs.length}</span></div>
  <div class="seg"><button data-a="qv" data-v="open" aria-pressed="${UI.qv==='open'}">Открытые</button><button data-a="qv" data-v="done" aria-pressed="${UI.qv==='done'}">Выполненные</button></div>
  <div class="chips">${chips}</div>
  ${body}
  <button class="btn ghost wide" data-a="q-new">+ Новый квест</button>`;
}

function vMe(){
  const {t, sp} = totals(), L = lvl(t), own = itemsOwned();
  const mx = Math.max(1, ...Object.keys(SPH).map(k => sp[k]||0));
  const spheres = Object.keys(SPH).map(k => {

  }).join('');
  const shelf = S.rewards.filter(r => r.lv).sort((a,b) => a.lv - b.lv).map(r => {

  <section class="card stack" style="gap:14px"><div class="between"><h3>Сферы</h3><span class="small muted">куда ушли сердечки</span></div>${spheres}<p class="small muted">Уровень один на всё сразу и считается по общей сумме сердечек.</p></section>

}

function vRewards(){
  const t = totals().t, L = lvl(t).n;
  const list = S.rewards.slice().sort((a,b) => (a.lv||99) - (b.lv||99));
  const next = list.filter(r => r.lv && !r.got && r.lv > L)[0];

function spark(m){
  const p = m.pts.slice(-20);
  if (p.length < 2) return '<svg viewBox="0 0 100 40" aria-hidden="true"><line x1="0" y1="34" x2="100" y2="34" stroke="var(--line)" stroke-dasharray="2 3"/></svg>';
  const xs = p.map(a=>a[0]), ys = p.map(a=>a[1]).concat([m.goal]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs) || 1, y0 = Math.min(...ys), y1 = Math.max(...ys);
  const X = x => x1 === x0 ? 50 : ((x-x0)/(x1-x0))*100, Y = y => y1 === y0 ? 20 : 36 - ((y-y0)/(y1-y0))*32;
  const pts = p.map(a => X(a[0]).toFixed(1)+','+Y(a[1]).toFixed(1)).join(' ');
  const last = p[p.length-1];
  return `<svg viewBox="0 0 100 40" preserveAspectRatio="none" aria-hidden="true"><line x1="0" x2="100" y1="${Y(m.goal).toFixed(1)}" y2="${Y(m.goal).toFixed(1)}" stroke="var(--done)" stroke-dasharray="2 3" stroke-width="1" vector-effect="non-scaling-stroke"/>
    <polyline points="${pts}" fill="none" stroke="var(--heart)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
    <circle cx="${X(last[0]).toFixed(1)}" cy="${Y(last[1]).toFixed(1)}" r="2.6" fill="var(--heart)"/></svg>`;
}
function mVal(m, v){ return (m.u === '$' ? '$' : '') + (m.dec ? String(v).replace('.',',') : fmt(v)); }
function vProgress(){
  const t = T();
  let cells = '';
  for (let d = 0; d < SEASON; d++){
    const h = S.days[d] || 0;
    const l = h <= 0 ? '' : h < 20 ? 'l1' : h < 45 ? 'l2' : h < 70 ? 'l3' : 'l4';
    cells += `<button class="c ${l}${d===t?' t':''}${d>t?' f':''}" data-a="day-open" data-d="${d}" aria-label="${dShort(d)}: ${fmt(h)} сердечек"></button>`;
  }
  const active = Object.keys(S.days).filter(k => S.days[k] > 0).length;
  const ms = Object.keys(S.metrics).map(k => {
    const m = S.metrics[k], cur = m.pts.length ? m.pts[m.pts.length-1][1] : 0;
    return `<button class="metric" data-a="m-open" data-id="${k}"><span class="eyebrow">${esc(m.n)}</span><span class="v">${mVal(m,cur)}${m.u && m.u!=='$' ? `<small>${esc(m.u)}</small>` : ''}</span>${spark(m)}<span class="small muted">цель ${mVal(m,m.goal)}${m.u && m.u!=='$' ? ' '+esc(m.u) : ''}</span></button>`;
  }).join('');
  let cd;
  if (S.ielts){
    const n = dayNum(parseISO(S.ielts)) - t;
    cd = `<div class="cd"><span class="n">${Math.max(0,n)}</span><div><b>${n >= 0 ? plural(n,'день','дня','дней')+' до IELTS' : 'IELTS позади'}</b><div class="small muted">${parseISO(S.ielts).getDate()} ${MON[parseISO(S.ielts).getMonth()]}</div></div></div>`;
  } else cd = `<div><b>Дата IELTS не выбрана</b><div class="small muted">Укажи, когда узнаешь, и здесь появится обратный отсчёт.</div></div>`;
  const qDone = S.quests.filter(q => q.rep ? q.cnt>0 : q.done).length, bosses = S.quests.filter(q => q.tier && (q.rep ? q.cnt>0 : q.done)).length;
  return `
  <h2>Прогресс</h2>
  <section class="card stack">
    <div class="between"><h3>Сезон: ${SEASON} дней</h3><span class="small muted">${dShort(0)} — ${dShort(SEASON-1)}</span></div>
    <div class="heat" aria-label="Сердечки по дням">${cells}</div>
    <div class="between"><span class="small muted num">активных дней: ${active} · квестов: ${qDone} · боссов: ${bosses}</span>
      <span class="legend">меньше<i style="background:var(--surface-2)"></i><i class="l" style="background:color-mix(in srgb,var(--heart) 40%,var(--surface-2))"></i><i style="background:var(--heart)"></i>больше</span></div>
  </section>
  <button class="card" data-a="ielts-open" style="text-align:left">${cd}</button>
  <div class="mgrid">${ms}</div>
  <p class="small muted">Нажми на день в календаре, чтобы увидеть, что ты сделала. Нажми на карточку, чтобы добавить новое значение или поменять цель.</p>`;
}

const val = id => { const e = document.getElementById(id); return e ? (e.type === 'checkbox' ? e.checked : e.value.trim()) : ''; };

function sheetStreak(){
  const t = T(), need = minNeed(t), act = S.habits.filter(h => hActive(h,t));
  const done = act.filter(h => hasEv(t,'h:'+h.id)).length, ok = minDone(t), st = streakNow();
  let wk = '';

  }

function evName(k){
  const p = String(k).split(':'), id = p[1];
  if (p[0] === 'h'){ const h = S.habits.find(x => x.id === id); return h ? h.n : 'Привычка (удалена)'; }
  if (p[0] === 'q'){ const q = quest(id); return q ? q.n : 'Квест (удалён)'; }
  if (p[0] === 'qx'){ const q = quest(id); return 'Отмена: ' + (q ? q.n : 'квест'); }
  return id === 's7' ? 'Бонус за 7 дней серии' : id === 's30' ? 'Бонус за 30 дней серии' : id === 'cb' ? 'Возвращение после паузы' : 'Бонус';
}

    <div class="field"><label for="f-max">Максимум раз для повторяемого (0 = без лимита)</label><input id="f-max" type="number" inputmode="numeric" min="0" value="${q.max||0}"></div>
    ${id && isDone ? `<button class="btn soft" data-a="q-undo" data-id="${esc(id)}">${q.rep ? 'Отменить последнее выполнение' : 'Отменить выполнение'}</button>` : ''}
    <div class="btns">${id ? `<button class="btn danger" data-a="q-del" data-id="${esc(id)}">Удалить</button>` : ''}<button class="btn" data-a="q-save" data-id="${esc(id||'')}">Сохранить</button></div>`);
}
function sheetReward(id){
  const r = id ? S.rewards.find(x => x.id === id) : {n:'', lv:lvl(totals().t).n+1, item:'gift'};
  if (!r) return;
  const lvOpts = [2,3,4,5,6,7,8,9,10].map(n => `<option value="lv${n}" ${r.lv===n?'selected':''}>Уровень ${n} · ${fmt((n-1)*COST)} 💗</option>`).join('');
  const qOpts = S.quests.filter(q => q.tier).map(q => `<option value="q:${esc(q.id)}" ${r.q===q.id?'selected':''}>Босс: ${esc(q.n)}</option>`).join('');
  const itOpts = Object.keys(ITEMS).map(k => `<option value="${k}" ${r.item===k?'selected':''}>${ITEMS[k]}</option>`).join('');
  openSheet(`<h2>${id ? 'Награда' : 'Новая награда'}</h2>
    <div class="field"><label for="f-n">Что дарю себе</label><input id="f-n" value="${esc(r.n)}" placeholder="Например, сумка"></div>
    <div class="field"><label for="f-c">Когда открывается</label><select id="f-c">${lvOpts}${qOpts}</select></div>
    <div class="field"><label for="f-it">Иконка и вещь у героини</label><select id="f-it">${itOpts}</select></div>
    ${id ? (r.got
      ? `<button class="btn soft" data-a="r-unclaim" data-id="${esc(id)}">Отменить отметку о покупке</button>`
      : `<button class="btn gold" data-a="r-claim" data-id="${esc(id)}">Уже купила, отметить</button>`) : ''}
    <div class="btns">${id ? `<button class="btn danger" data-a="r-del" data-id="${esc(id)}">Удалить</button>` : ''}<button class="btn" data-a="r-save" data-id="${esc(id||'')}">Сохранить</button></div>`);
}
function sheetMetric(k){
  const m = S.metrics[k]; if (!m) return;
  const hist = m.pts.slice(-8).reverse().map(p => `<div><span class="muted">${dShort(p[0])}</span><b class="num">${mVal(m,p[1])} ${m.u!=='$'?esc(m.u):''}</b></div>`).join('');
  openSheet(`<h2>${esc(m.n)}</h2>
    <div class="two"><div class="field"><label for="f-v">Новое значение</label><input id="f-v" type="number" inputmode="decimal" step="any" placeholder="${m.pts.length ? m.pts[m.pts.length-1][1] : ''}"></div>
    <div class="field"><label for="f-g">Цель</label><input id="f-g" type="number" inputmode="decimal" step="any" value="${m.goal}"></div></div>
    <button class="btn wide" data-a="m-save" data-id="${k}">Сохранить</button>
    ${hist ? `<div class="stack"><span class="eyebrow">Последние записи</span><div class="hist">${hist}</div></div>` : ''}
    ${m.pts.length > 1 ? `<button class="linkbtn" data-a="m-undo" data-id="${k}">Удалить последнюю запись</button>` : ''}`);
}
function sheetIelts(){
  openSheet(`<h2>Дата IELTS</h2>
    <div class="field"><label for="f-d">Дата экзамена</label><input id="f-d" type="date" value="${esc(S.ielts)}"></div>
    <div class="btns">${S.ielts ? '<button class="btn danger" data-a="ielts-clear">Убрать дату</button>' : ''}<button class="btn" data-a="ielts-save">Сохранить</button></div>`);
}
function sheetSettings(){
  const th = [['auto','Как в телефоне'],['light','Светлая'],['dark','Тёмная']].map(o => `<button data-a="theme" data-v="${o[0]}" aria-pressed="${S.theme===o[0]}">${o[1]}</button>`).join('');
  openSheet(`<h2>Настройки</h2>
    <div class="field"><label>Тема</label><div class="seg" style="grid-template-columns:repeat(3,1fr)">${th}</div></div>
    <div class="field"><label for="f-start">Начало сезона</label><input id="f-start" type="date" value="${esc(S.start)}"></div>
    <button class="btn ghost" data-a="start-save">Сохранить дату начала</button>
    <p class="small muted">${Store.cloud ? 'Прогресс хранится в облаке Telegram и доступен с любого устройства.' : 'Прогресс хранится в этом браузере. Внутри Telegram он будет сохраняться в облаке.'}</p>
    <div class="btns"><button class="btn ghost" data-a="export">Резервная копия</button><button class="btn ghost" data-a="import-open">Восстановить</button></div>
    <button class="btn danger" data-a="reset">Начать сезон заново</button>`);
}

/* ---------- эффекты ---------- */
function toast(text){
  const el = document.createElement('div'); el.className = 'toast'; el.textContent = text;
  document.body.appendChild(el); setTimeout(() => el.remove(), 2700);
}
function fx(text, ev){
  const el = document.createElement('div'); el.className = 'fx'; el.textContent = text;
  const x = ev && ev.clientX ? ev.clientX : innerWidth/2, y = ev && ev.clientY ? ev.clientY : innerHeight/2;
  el.style.left = Math.min(innerWidth-40, Math.max(40, x)) + 'px'; el.style.top = (y - 18) + 'px';
  document.body.appendChild(el); setTimeout(() => el.remove(), 1000);
}
function after(){ const t = T(), had = hasEv(t, 'b:cb:'+t); recalc(); if (!had && hasEv(t, 'b:cb:'+t)) toast('Возвращение засчитано: +100 💗'); checkLevel(); save(); render(); }

/* ---------- действия ---------- */
function completeQuest(q, ev){
  const t = T();
  if (q.rep){ if (q.max && q.cnt >= q.max) return; q.cnt++; }
  else { if (q.done) return; q.done = 1; q.at = t; }
  addEv(t, 'q:'+q.id, q.h, q.s);
  fx('+'+fmt(q.h)+' 💗', ev); haptic(q.tier ? 'success' : 'medium');
  if (q.tier){
    const L = lvl(totals().t).n;
    const rw = S.rewards.filter(r => r.q === q.id && !r.got);
    setTimeout(() => {
      if ($('#layer').innerHTML) return;
      showModal(`<p class="eyebrow">${q.tier==='legend'?'Легендарный квест':'Босс повержен'}</p><div class="av">${avatar({id:'b', level:L})}</div>
        <h2>${esc(q.n)}</h2><p class="big">+${fmt(q.h)} 💗</p>
        ${rw.length ? `<p class="muted">Открыта награда: <b style="color:var(--ink)">${rw.map(r=>esc(r.n)).join(', ')}</b></p>` : ''}
        <button class="btn wide" data-a="close">Дальше</button>`);
    }, 350);
  }
}
function undoQuest(q){
  const e = rmLast(x => x[1] === 'q:'+q.id);
  if (!e) addEv(T(), 'qx:'+q.id, -q.h, q.s);
  if (q.rep) q.cnt = Math.max(0, q.cnt-1); else { q.done = 0; delete q.at; }
}

const A = {
  tab(b){ UI.tab = b.dataset.t; closeSheet(); render(); scrollTo(0,0); },
  hab(b, ev){
    const h = S.habits.find(x => x.id === b.dataset.id); if (!h) return;
    const t = Math.min(UI.sel == null ? T() : UI.sel, T()), key = 'h:'+h.id;
    if (hasEv(t, key)) { rmLast(e => e[0]===t && e[1]===key); haptic('light'); }
    else { addEv(t, key, h.h, h.s); fx('+'+h.h+' 💗', ev); haptic('medium'); }
    after();
  },
  day(b){ UI.sel = Math.max(0, Math.min(T(), (UI.sel == null ? T() : UI.sel) + (+b.dataset.v))); haptic('light'); render(); },
  'day-today'(){ UI.sel = T(); render(); },
  'day-open'(b){ sheetDay(+b.dataset.d); },
  'day-edit'(b){ UI.sel = +b.dataset.d; UI.tab = 'today'; closeSheet(); render(); scrollTo(0,0); },
  'q-do'(b, ev){ const q = quest(b.dataset.id); if (q){ completeQuest(q, ev); after(); } },
  'q-open'(b){ sheetQuest(b.dataset.id); },
  'q-new'(){ sheetQuest(null); },
  'q-undo'(b){ const q = quest(b.dataset.id); if (q){ undoQuest(q); closeSheet(); after(); toast('Отменено'); } },
  'q-save'(b){
    const n = val('f-n'); if (!n) return toast('Впиши название квеста');
    const id = b.dataset.id, q = id ? quest(id) : Q('u'+uid(), '', 'body', 100);
    q.n = n; q.s = val('f-s'); q.h = Math.max(1, parseInt(val('f-h'))||1); q.rep = val('f-rep')==='1' ? 1 : 0; q.tier = val('f-tier'); q.max = Math.max(0, parseInt(val('f-max'))||0);
    if (!id) S.quests.push(q);
    closeSheet(); save(); render(); toast(id ? 'Сохранено' : 'Квест добавлен');
  },
  'q-del'(b){
    if (!b.dataset.armed){ b.dataset.armed = 1; b.textContent = 'Точно удалить?'; return; }
    S.quests = S.quests.filter(q => q.id !== b.dataset.id); closeSheet(); save(); render(); toast('Квест удалён');
  },
  qf(b){ UI.qf = b.dataset.v; render(); },
  qv(b){ UI.qv = b.dataset.v; render(); },
  'h-list'(){ sheetHabits(); },
  streak(){ sheetStreak(); },
  'h-open'(b){ sheetHabit(b.dataset.id); },
  'h-new'(){ sheetHabit(null); },
  'h-save'(b){
    const n = val('f-n'); if (!n) return toast('Впиши название привычки');
    const id = b.dataset.id, h = id ? S.habits.find(x => x.id === id) : {id:'u'+uid()};
    h.n = n; h.s = val('f-s'); h.h = Math.max(1, parseInt(val('f-h'))||1);
    const fd = val('f-from'); h.from = fd ? Math.max(0, week(dayNum(parseISO(fd)))) : 0;
    h.pw = Math.min(7, Math.max(0, parseInt(val('f-pw'))||0)) || undefined;
    if (h.to != null && h.to <= h.from) delete h.to;
    if (!id) S.habits.push(h);
    after(); sheetHabits(); toast(id ? 'Сохранено' : 'Привычка добавлена');
  },
  'h-del'(b){
    if (!b.dataset.armed){ b.dataset.armed = 1; b.textContent = 'Точно удалить?'; return; }
    S.habits = S.habits.filter(h => h.id !== b.dataset.id); after(); sheetHabits(); toast('Привычка удалена');
  },
  'r-open'(b){ sheetReward(b.dataset.id); },
  'r-new'(){ sheetReward(null); },
  'r-claim'(b){
    const r = S.rewards.find(x => x.id === b.dataset.id); if (!r) return;
    r.got = 1; r.at = T(); haptic('success'); closeSheet(); save(); render();
    showModal(`<p class="eyebrow">Подарок себе</p><div class="av">${avatar({id:'r', level:lvl(totals().t).n})}</div><h2>${esc(r.n)}</h2><p class="muted">Теперь это есть и у героини. Носи с удовольствием.</p><button class="btn wide" data-a="close">Ура</button>`);
  },
  'r-unclaim'(b){ const r = S.rewards.find(x => x.id === b.dataset.id); if (r){ r.got = 0; delete r.at; closeSheet(); save(); render(); } },
  'r-save'(b){
    const n = val('f-n'); if (!n) return toast('Впиши название награды');
    const id = b.dataset.id, r = id ? S.rewards.find(x => x.id === id) : {id:'u'+uid()};
    r.n = n; r.item = val('f-it');
    const c = val('f-c');
    if (c.startsWith('lv')){ r.lv = parseInt(c.slice(2)); delete r.q; } else { r.q = c.slice(2); delete r.lv; }
    if (!id) S.rewards.push(r);
    closeSheet(); save(); render(); toast(id ? 'Сохранено' : 'Награда добавлена');
  },
  'r-del'(b){
    if (!b.dataset.armed){ b.dataset.armed = 1; b.textContent = 'Точно удалить?'; return; }
    S.rewards = S.rewards.filter(r => r.id !== b.dataset.id); closeSheet(); save(); render(); toast('Награда удалена');
  },
  'm-open'(b){ sheetMetric(b.dataset.id); },
  'm-save'(b){
    const m = S.metrics[b.dataset.id]; if (!m) return;
    const v = parseFloat(val('f-v').replace(',','.')), g = parseFloat(val('f-g').replace(',','.'));
    if (!isNaN(g)) m.goal = g;
    if (!isNaN(v)){ const t = T(); m.pts = m.pts.filter(p => p[0] !== t); m.pts.push([t, v]); }
    closeSheet(); save(); render(); toast('Записано');
  },
  'm-undo'(b){ const m = S.metrics[b.dataset.id]; if (m && m.pts.length > 1){ m.pts.pop(); save(); render(); sheetMetric(b.dataset.id); } },
  'ielts-open'(){ sheetIelts(); },
  'ielts-save'(){ S.ielts = val('f-d'); closeSheet(); save(); render(); },
  'ielts-clear'(){ S.ielts = ''; closeSheet(); save(); render(); },
  settings(){ sheetSettings(); },
  theme(b){ S.theme = b.dataset.v; applyTheme(); save(); sheetSettings(); },
  'start-save'(){
    const v = val('f-start'); if (!v) return;
    if (v !== S.start){
      const shift = Math.round((parseISO(v) - parseISO(S.start))/DAY);
      S.events.forEach(e => e[0] -= shift);
      const nd = {}; Object.keys(S.days).forEach(k => nd[+k - shift] = S.days[k]); S.days = nd;
      S.frozen = S.frozen.map(d => d - shift); S.lastChecked -= shift;
      Object.values(S.metrics).forEach(m => m.pts.forEach(p => p[0] -= shift));
      S.quests.forEach(q => { if (q.at != null) q.at -= shift; });
      S.rewards.forEach(r => { if (r.at != null) r.at -= shift; });
      S.start = v; UI.lastDay = null;
    }
    closeSheet(); save(); render(); toast('Дата начала сохранена');
  },
  export(){
    const str = JSON.stringify(S);
    openSheet(`<h2>Резервная копия</h2><p class="small muted">Скопируй текст и сохрани его в заметках или в «Избранном» Telegram.</p>
      <div class="field"><textarea id="f-exp" readonly>${esc(str)}</textarea></div><button class="btn" data-a="copy">Скопировать</button>`);
  },
  copy(){
    const ta = $('#f-exp'); const s = ta.value;
    const fallback = () => { ta.focus(); ta.select(); try { document.execCommand('copy'); toast('Скопировано'); } catch(e){ toast('Выдели текст и скопируй вручную'); } };
    try { navigator.clipboard.writeText(s).then(() => toast('Скопировано'), fallback); } catch(e){ fallback(); }
  },
  'import-open'(){
    openSheet(`<h2>Восстановить</h2><p class="small muted">Вставь текст резервной копии. Текущий прогресс заменится.</p>
      <div class="field"><textarea id="f-imp" placeholder="{...}"></textarea></div><button class="btn" data-a="import-do">Восстановить</button>`);
  },
  'import-do'(){
    try { const st = JSON.parse(val('f-imp')); if (!st || !st.habits || !st.quests) throw 0; S = normalize(st); UI.lastDay = null; applyTheme(); closeSheet(); save(); render(); toast('Прогресс восстановлен'); }
    catch(e){ toast('Не получилось прочитать копию. Проверь, что вставлен весь текст'); }
  },
  reset(b){
    if (!b.dataset.armed){ b.dataset.armed = 1; b.textContent = 'Нажми ещё раз: всё обнулится'; return; }
    const th = S.theme; S = fresh(); S.theme = th; UI.lastDay = null; closeSheet(); save(); render(); toast('Новый сезон начался');
  },
  close(){ closeSheet(); },
  'close-bg'(b, ev){ if (ev.target === b) closeSheet(); }
};
document.addEventListener('click', ev => {
  const b = ev.target.closest('[data-a]'); if (!b) return;
  const fn = A[b.dataset.a]; if (!fn) return;
  if (b.dataset.a === 'close-bg' && ev.target !== b) return;
  fn(b, ev);
});

/* ---------- тема ---------- */
const hostTheme = document.documentElement.getAttribute('data-theme');
function applyTheme(){
  const r = document.documentElement;
  let m = S ? S.theme : 'auto';
  if (m === 'auto' && inTG) m = tg.colorScheme;
  if (m === 'light' || m === 'dark') r.setAttribute('data-theme', m);
  else if (hostTheme) r.setAttribute('data-theme', hostTheme); else r.removeAttribute('data-theme');
  if (inTG){
    const c = getComputedStyle(document.body).backgroundColor.match(/\d+/g);
    if (c){ const hex = '#' + c.slice(0,3).map(x => (+x).toString(16).padStart(2,'0')).join('');
      try { if (ver('6.1')){ tg.setHeaderColor(hex); tg.setBackgroundColor(hex); } if (ver('7.10')) tg.setBottomBarColor(hex); } catch(e){} }
  }
}

/* ---------- старт ---------- */
async function boot(){
  if (inTG){
    try { tg.ready(); tg.expand(); if (ver('7.7')) tg.disableVerticalSwipes(); } catch(e){}
    tg.onEvent && tg.onEvent('themeChanged', applyTheme);
  }
  Store.init();
  const st = await Store.load();
  S = st && st.habits ? normalize(st) : fresh();
  applyTheme();
  render();
  if (!st) save();
  document.addEventListener('visibilitychange', () => { if (document.hidden) Store.flush(); else render(); });
  setInterval(() => { if (T() !== UI.lastDay) render(); }, 60000);
}
boot();
})();
</script>
